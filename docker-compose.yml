version: '3.8'

services:
  # 🐍 Python FastAPI バックエンド
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # ホストPCの AWS 認証情報をコンテナ内にマウントし、Bedrock や S3 に安全にアクセス可能にします
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}  # ホストPCのプロファイルを選択可能 (デフォルトは default)
      - AWS_REGION=ap-northeast-1            # 東京リージョン
      - DYNAMODB_TABLE=snap-kakeibo-transactions-dev
      - S3_BUCKET=snap-kakeibo-receipts-dev
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    restart: always

  # ⚛️ React (Vite) フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules をホスト側と同期させず、コンテナ側でクローズドに保持するためのボリューム設定
      - /app/node_modules
    depends_on:
      - backend
    restart: always

  # 💾 ローカル用 DynamoDB (AWS公式エミュレータ)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: snap-kakeibo-dynamodb-local
    ports:
      - "8008:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    restart: always

  # 🖥️ DynamoDB GUI 管理ツール (dynamodb-admin)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: snap-kakeibo-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    restart: always
